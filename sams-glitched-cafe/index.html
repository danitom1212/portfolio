<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sam's Glitched Cafe</title>
<meta name="description" content="ויזואל נובל רומנטי אינטראקטיבי — קפה הגליץ' של סאם, עם טוויסט וכמה סופים.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <div id="stage" dir="rtl">
    <div id="bg-a" class="bg-layer"></div>
    <div id="bg-b" class="bg-layer"></div>
    <div id="bg-decor"></div>
    <div id="vfx-overlay"></div>
    <canvas id="vrm-layer"></canvas>
    <div id="sprite-layer"></div>

    <div id="choice-panel"></div>

    <div id="dialogue-box">
      <div id="name-tag"></div>
      <div id="dialogue-text"></div>
      <div id="continue-arrow">▼</div>
    </div>

    <button id="debug-toggle" title="Stats">🐞</button>
    <div id="debug-panel" hidden></div>
    <button id="mute-toggle" title="Sound">🔊</button>

    <div id="start-screen" class="overlay-screen">
      <div class="title-en">a romance with a secret</div>
      <div class="title-he">קפה הגליץ׳ של סאם</div>
      <p class="subtitle">לילה גשום, בית קפה זר, ובעל בית קפה שיודע לשמור סוד טוב מדי. חמישה סופים אפשריים — תלוי מה תבחרי לשמוע.</p>
      <div class="start-btns">
        <button id="start-btn" class="btn">להיכנס פנימה</button>
        <button id="continue-btn" class="btn btn-ghost" hidden>המשך מהיכן שהפסקתי</button>
      </div>
      <p class="art-credit">דמויות: LisadiKaprio · רקע: Spiral Atlas · צליל: NenadSimic ואחרים — קרדיטים מלאים ב-CREDITS.md</p>
    </div>

    <div id="end-screen" class="overlay-screen" hidden>
      <div class="title-en">the end</div>
      <div id="end-title" class="ending-title"></div>
      <button id="restart-btn" class="btn">לשחק שוב</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
